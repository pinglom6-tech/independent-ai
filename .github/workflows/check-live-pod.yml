name: Independent pod status verification
on:
  push:
    paths:
      - '.github/workflows/check-live-pod.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query RunPod and save evidence
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,datetime
          url='https://api.runpod.io/v2/pods/o7nqskrov34oew'
          headers={'Authorization':'Bearer '+os.environ['RUNPOD_API_KEY'].strip()}
          try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: pod=json.load(r)
              data={'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'pod_status':pod.get('status'),'startup_args':pod.get('args'),'image':pod.get('image'),'ssh_direct_available':bool((pod.get('ssh') or {}).get('direct'))}
          except Exception as e:
              data={'error':str(e)}
          os.makedirs('diagnostics',exist_ok=True)
          with open('diagnostics/live-pod.json','w') as f:json.dump(data,f,indent=2)
          print(json.dumps(data))
          PY
      - name: Publish check result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/live-pod.json
          git commit -m 'Record live pod status' || true
          git push
