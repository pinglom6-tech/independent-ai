name: Deploy Static Chat UI
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-static-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable GitHub Pages automatically
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,urllib.request,urllib.error,json
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/pages'
          h={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          req=urllib.request.Request(url,data=json.dumps({'build_type':'workflow'}).encode(),headers=h,method='POST')
          try:
              with urllib.request.urlopen(req,timeout=20) as r: print('PAGES ENABLED:',r.status)
          except urllib.error.HTTPError as e:
              print('PAGES ENABLE RESPONSE:',e.code,e.read().decode()[:700])
              if e.code not in (409,422): raise
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
