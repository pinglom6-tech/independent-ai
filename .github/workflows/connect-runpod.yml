name: Establish RunPod SSH access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect RunPod pod using verified API v2
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          url='https://api.runpod.io/v2/pods'
          key=os.environ.get('RUNPOD_API_KEY','').strip()
          if not key:
              raise RuntimeError('RUNPOD_API_KEY is empty')
          if any(ch in key for ch in ('\\r','\\n',' ','\\t')):
              raise RuntimeError('RUNPOD_API_KEY contains whitespace inside the key; replace GitHub secret with raw key only')
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+key})
          try:
              with urllib.request.urlopen(req,timeout=30) as response:
                  data=json.load(response)
              pods=data if isinstance(data,list) else data.get('pods',data.get('data',[]))
              if isinstance(pods,dict): pods=pods.get('pods',[])
              print('API v2 authenticated. Pod count:',len(pods))
              for pod in pods:
                  print(json.dumps({k:pod.get(k) for k in ('id','name','desiredStatus','status','imageName','ports') if k in pod}))
              target='o7nqskrov34oew'
              matches=[p for p in pods if p.get('id')==target]
              if not matches:
                  print('TARGET_POD_NOT_FOUND: target pod is not listed under this API key')
              else:
                  print('TARGET_POD_FOUND; state:',matches[0].get('desiredStatus',matches[0].get('status','unknown')))
          except urllib.error.HTTPError as e:
              print('HTTP ERROR',e.code)
              raise
          PY
