name: Fix RunPod startup
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-runpod-startup.yml'
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Update existing pod startup command
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          pod = "o7nqskrov34oew"
          url = f"https://api.runpod.io/v2/pods/{pod}"
          script = """bash -lc 'bash /workspace/install.sh > /workspace/install-output.log 2>&1; cd /workspace/independent-ai || exit 1; (./start-model.sh >> /workspace/install-output.log 2>&1) & python -m pip install -q gradio openai >> /workspace/install-output.log 2>&1; test -f chat-ui/app.py || { echo Missing-chat-ui >> /workspace/install-output.log; exit 1; }; sed -i "s/server_port=7860/server_port=8888/" chat-ui/app.py; export CHAT_UI_PASSWORD="${JUPYTER_PASSWORD}"; python chat-ui/app.py >> /workspace/chat-ui.log 2>&1'"""
          headers = {"Authorization": "Bearer " + os.environ["RUNPOD_API_KEY"], "Content-Type": "application/json"}
          def call(method, address, data=None):
              req=urllib.request.Request(address,headers=headers,method=method,data=json.dumps(data).encode() if data is not None else None)
              with urllib.request.urlopen(req,timeout=45) as response:
                  return json.load(response)
          before=call("GET",url)
          print("Before:",before.get("id"),before.get("status"),"args length",len(str(before.get("args",""))))
          result=call("PATCH",url,{"args":script})
          print("Updated pod:",result.get("id"),"args match:",result.get("args")==script)
          after=call("GET",url)
          print("Verified args:",after.get("args")==script)
          if after.get("args")!=script: raise SystemExit("Startup command not saved")
          print("Restarting existing pod to apply startup command")
          try:
              restart=call("POST",url+"/action",{"action":"restart"})
              print("Restart requested:",str(restart)[:350])
          except Exception as exc:
              raise SystemExit("Startup updated, but restart failed: "+str(exc))
          PY
