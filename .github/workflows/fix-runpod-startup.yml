name: Fix RunPod startup
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-runpod-startup.yml"
      - "bootstrap-runpod.sh"

permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Update existing pod startup command
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          pod = "o7nqskrov34oew"
          url = f"https://api.runpod.io/v2/pods/{pod}"
          script = "bash -lc 'curl -fsSL https://raw.githubusercontent.com/pinglom6-tech/independent-ai/main/bootstrap-runpod.sh -o /tmp/bootstrap-runpod.sh && bash /tmp/bootstrap-runpod.sh'"

          headers = {"Authorization": "Bearer " + os.environ["RUNPOD_API_KEY"].strip(), "Content-Type": "application/json"}
          def call(method, address, data=None):
              req=urllib.request.Request(address,headers=headers,method=method,data=json.dumps(data).encode() if data is not None else None)
              with urllib.request.urlopen(req,timeout=45) as response:
                  return json.load(response)
          before=call("GET",url)
          print("Before:",before.get("id"),before.get("status"),"args length",len(str(before.get("args",""))))
          result=call("PATCH",url,{"args":json.dumps({"entrypoint":["/bin/bash","-lc"],"cmd":[script]})})
          print("Updated pod:",result.get("id"),"args match:",result.get("args")==json.dumps({"entrypoint":["/bin/bash","-lc"],"cmd":[script]}))
          after=call("GET",url)
          print("Verified args:",after.get("args")==json.dumps({"entrypoint":["/bin/bash","-lc"],"cmd":[script]}))
          if after.get("args")!=json.dumps({"entrypoint":["/bin/bash","-lc"],"cmd":[script]}): raise SystemExit("Startup command not saved")
          print("Restarting existing pod to apply startup command")
          try:
              restart=call("POST",url+"/action",{"action":"restart"})
              print("Restart requested:",str(restart)[:350])
          except Exception as exc:
              raise SystemExit("Startup updated, but restart failed: "+str(exc))
          PY
