name: Start authorized RunPod GPU
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Start existing pod through RunPod REST v2
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,time
          key=os.environ['RUNPOD_API_KEY'].strip()
          if not key or any(c.isspace() for c in key): raise RuntimeError('Malformed API key')
          root='https://api.runpod.io/v2/pods'
          pod='o7nqskrov34oew'
          def call(url,method='GET',payload=None):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'},method=method,data=json.dumps(payload).encode() if payload is not None else None)
              try:
                  with urllib.request.urlopen(req,timeout=35) as r:return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  print('API error HTTP',e.code,'body:',e.read(600).decode('utf-8','replace'))
                  raise
          status,pods=call(root)
          items=pods if isinstance(pods,list) else pods.get('pods',[])
          match=next((p for p in items if p.get('id')==pod),None)
          if match is None:raise RuntimeError('Target pod not found; will not create replacement')
          state=match.get('desiredStatus',match.get('status','unknown'))
          print('Pod exists. State:',state)
          if state=='EXITED':
              status,response=call(root+'/'+pod+'/action','POST',{'action':'start'})
              print('Start request accepted HTTP',status)
          elif state=='RUNNING':print('Already running; no start request needed')
          else:print('Current state',state,'; no start request sent')
          for i in range(6):
              time.sleep(10)
              _,data=call(root)
              arr=data if isinstance(data,list) else data.get('pods',[])
              p=next((x for x in arr if x.get('id')==pod),{})
              print('Pod state after',10*(i+1),'seconds:',p.get('desiredStatus',p.get('status','unknown')))
              if p.get('desiredStatus')=='RUNNING':break
          PY
