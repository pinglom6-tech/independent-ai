name: Switch Pages to gh-pages branch
on:
  push:
    paths: ['.github/workflows/switch-pages-branch.yml']
permissions:
  contents: read
  pages: write
jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - name: Configure branch publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/pages'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          payload=json.dumps({'build_type':'legacy','source':{'branch':'gh-pages','path':'/'}}).encode()
          req=urllib.request.Request(url,method='PUT',data=payload,headers=headers)
          try:
              with urllib.request.urlopen(req,timeout=30) as resp: print('PAGES UPDATE',resp.status,resp.read().decode()[:1000])
          except urllib.error.HTTPError as e:
              print('PAGES UPDATE FAILED',e.code,e.read().decode()[:1500])
              raise
          PY
