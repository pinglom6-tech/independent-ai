name: Remote GPU deployment
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remote-deploy.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Verify installer and create SSH identity
        run: |
          bash -n scripts/install.sh
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/runpod_ai
      - name: Register temporary SSH public key
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          root='https://api.runpod.io/v2'
          key=os.environ['RUNPOD_API_KEY'].strip()
          headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'}
          def call(path,method='GET',body=None):
              req=urllib.request.Request(root+path,headers=headers,method=method,data=json.dumps(body).encode() if body is not None else None)
              with urllib.request.urlopen(req,timeout=40) as r:return json.load(r)
          data=call('/account/ssh-keys')
          keys=data.get('keys',[])
          pub=open(os.path.expanduser('~/.ssh/runpod_ai.pub')).read().strip()
          if not any(k.split()[:2]==pub.split()[:2] for k in keys):
              call('/account/ssh-keys','PUT',{'keys':keys+[pub]})
          print('Deployment SSH key registered')
          PY
      - name: Restart existing pod to load SSH key
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,time,urllib.request
          root='https://api.runpod.io/v2/pods/o7nqskrov34oew'
          headers={'Authorization':'Bearer '+os.environ['RUNPOD_API_KEY'].strip(),'Content-Type':'application/json'}
          def call(path='',method='GET',body=None):
              req=urllib.request.Request(root+path,headers=headers,method=method,data=json.dumps(body).encode() if body is not None else None)
              with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
          pod=call()
          print('Initial pod status:',pod.get('status'))
          if pod.get('status')=='RUNNING':
              call('/action','POST',{'action':'stop'})
              for i in range(36):
                  time.sleep(5)
                  pod=call()
                  if pod.get('status')=='EXITED':break
              else:raise RuntimeError('Pod did not stop')
          call('/action','POST',{'action':'start'})
          for i in range(72):
              time.sleep(5)
              pod=call()
              if pod.get('status')=='RUNNING' and pod.get('ssh',{}).get('direct'):
                  break
          else:raise RuntimeError('Pod did not become SSH ready')
          print('Pod running with SSH metadata')
          direct=pod['ssh']['direct']
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('POD_SSH_HOST='+str(direct['host'])+'\n')
              out.write('POD_SSH_PORT='+str(direct['port'])+'\n')
          PY
      - name: Execute installation over SSH
        run: |
          for i in $(seq 1 30); do
            if ssh -i ~/.ssh/runpod_ai -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=8 -p $POD_SSH_PORT root@$POD_SSH_HOST 'echo CONNECTED'; then break; fi
            sleep 10
          done
          ssh -i ~/.ssh/runpod_ai -o StrictHostKeyChecking=accept-new -o BatchMode=yes -p $POD_SSH_PORT root@$POD_SSH_HOST 'bash -s' < scripts/install.sh
          echo 'INSTALL_COMPLETED'
          ssh -i ~/.ssh/runpod_ai -o StrictHostKeyChecking=accept-new -o BatchMode=yes -p $POD_SSH_PORT root@$POD_SSH_HOST 'cd /workspace/independent-ai && nohup ./start-model.sh > model.log 2>&1 < /dev/null &'
          echo 'MODEL_LAUNCH_REQUESTED'
