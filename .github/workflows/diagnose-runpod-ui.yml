name: Diagnose RunPod UI
on:
  push:
    paths:
      - '.github/workflows/diagnose-runpod-ui.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["Fix RunPod startup"]
    types: [completed]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe pod and HTTP UI
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,time,base64
          pod='o7nqskrov34oew'
          time.sleep(100)
          key=os.environ['RUNPOD_API_KEY'].strip()
          req=urllib.request.Request(f'https://api.runpod.io/v2/pods/{pod}',headers={'Authorization':'Bearer '+key})
          with urllib.request.urlopen(req,timeout=25) as resp: p=json.load(resp)
          report=['POD STATUS: '+str(p.get('status'))+' runtime: '+str(p.get('runtime'))]
          print(report[-1])
          print('ARGS:',str(p.get('args',''))[:200])
          logurl=f'https://api.runpod.io/v2/pods/{pod}/logs?source=container&tail=30'
          try:
              req=urllib.request.Request(logurl,headers={'Authorization':'Bearer '+key,'Accept':'text/event-stream'})
              with urllib.request.urlopen(req,timeout=15) as resp:
                  print('LOG HTTP:',resp.status)
                  for i in range(50):
                      line=resp.readline().decode('utf-8','replace').strip()
                      if not line: continue
                      if line.startswith('data:'):
                          try:
                              parsed=json.loads(line[5:]); report.append('LOG: '+parsed.get('line','')[:700])
                          except: pass
          except urllib.error.HTTPError as e: print('LOG ERROR:',e.code,e.read(500).decode('utf-8','replace'))
          except Exception as e: print('LOG ERROR:',str(e)[:300])
          for i in range(3):
              try:
                  with urllib.request.urlopen('https://'+pod+'-8888.proxy.runpod.net/',timeout=12) as resp:
                      body=resp.read(250).decode('utf-8','replace')
                      print('HTTP UI:',resp.status,'body:',body[:150])
                      if resp.status==200: break
              except Exception as e: print('HTTP UI ERROR:',str(e)[:220])
              time.sleep(6)
          print('BOOT_LOGS:', '\\n'.join(report[-80:]))
          path='diagnostics/latest-health.txt'
          url='https://api.github.com/repos/'+os.environ['REPO']+'/contents/'+path
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json'}
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as r: sha=json.load(r)['sha']
          except urllib.error.HTTPError as e:
              if e.code!=404: raise
              sha=None
          data={'message':'Record latest pod health check','content':base64.b64encode(('\\n'.join(report[-100:])).encode()).decode()}
          if sha:data['sha']=sha
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers,method='PUT',data=json.dumps(data).encode()),timeout=30) as r:print('Saved health report',r.status)
          PY
