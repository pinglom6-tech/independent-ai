<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Independent AI</title><style>*{box-sizing:border-box}body{margin:0;background:#10131a;color:#edf0f7;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:850px;margin:auto;height:100dvh;display:flex;flex-direction:column}header{padding:17px;border-bottom:1px solid #394050;display:flex;justify-content:space-between}button{border:0;border-radius:9px;background:#4f76df;color:white;padding:12px;font:inherit}#chat{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}.msg{max-width:92%;align-self:flex-start;background:#282f3c;padding:13px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.user{align-self:flex-end;background:#284b85}form{display:flex;gap:8px;padding:12px 12px max(12px,env(safe-area-inset-bottom))}textarea{flex:1;background:#1d222b;color:white;border:1px solid #485064;border-radius:9px;padding:12px;font:inherit;resize:none}#status{font-size:12px;color:#b8c0cf;padding:6px 15px}button:disabled{opacity:.5}</style><main><header><strong>Independent AI</strong><button id="clear" type="button">New chat</button></header><div id="chat"><div class="msg">Welcome to Independent AI.</div></div><div id="status">Checking model…</div><form id="composer"><textarea id="message" rows="2" placeholder="Message Independent AI…" aria-label="Message"></textarea><button id="send">Send</button></form></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),chat=$('chat');let history=[],busy=false;function add(role,text){const el=document.createElement('div');el.className='msg '+(role==='user'?'user':'');el.textContent=text;chat.append(el);chat.scrollTop=chat.scrollHeight;return el}async function health(){try{const r=await fetch('/health');$('status').textContent=r.ok?'Model ready':'Model starting or unavailable'}catch{$('status').textContent='Model unavailable'}}health();$('clear').onclick=()=>{history=[];chat.replaceChildren();add('assistant','New conversation started.')};$('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit()}};$('composer').onsubmit=async e=>{e.preventDefault();if(busy)return;const input=$('message'),value=input.value.trim();if(!value)return;input.value='';add('user',value);history.push({role:'user',content:value});const bubble=add('assistant','Thinking…');busy=true;$('send').disabled=true;try{const r=await fetch('/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,max_tokens:1024,stream:false})});const data=await r.json();if(!r.ok)throw Error(data.error||'HTTP '+r.status);const answer=data.choices?.[0]?.message?.content;if(!answer)throw Error('Empty model response');bubble.textContent=answer;history.push({role:'assistant',content:answer});$('status').textContent='Connected'}catch(err){bubble.textContent='Connection error: '+err.message;$('status').textContent='Model unavailable'}finally{busy=false;$('send').disabled=false}}})();</script></html>
